[project]
name = "codebase-review-swarm"
version = "0.1.0"
description = "Human-approved, dependency-aware multi-agent code review"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_swarm"]

[project.scripts]
review-swarm = "review_swarm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
